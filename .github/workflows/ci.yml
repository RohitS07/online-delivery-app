# The same checks as `make lint-app build-app test-app` in the workspace (RULE-0019).
name: ci

on:
  pull_request:
  # Lets CI be started by hand: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Format and lint before the build and the tests.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test --if-present -- --run
